# Build xmonad-contrib against the river backend, to measure how much of it
# survives.  The xmonad checkout next door is the river fork: it provides no
# Graphics.X11 and a deliberately reduced API.  No flag selects that any more,
# because there is nothing else it could build.
resolver: lts-24.53

packages:
- ./
- ../xmonad

# Stack's nix integration is on by default on NixOS; stack-shell.nix says
# what goes in the shell, and why it is a file rather than a package list.
nix:
  shell-file: stack-shell.nix
